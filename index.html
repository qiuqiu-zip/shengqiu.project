<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="星选商城：支持商品浏览、购物车、下单与订单管理的在线商城演示系统。" />
  <title>星选商城</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand" aria-label="星选商城">
        <div class="brand-logo">星</div>
        <span>星选商城</span>
      </div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-btn active" data-view="products">商品</button>
        <button class="nav-btn" data-view="orders">我的订单</button>
        <button class="cart-button" id="openCart" aria-label="打开购物车">
          <span>购物车</span><span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="productsView">
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">ONLINE SHOP · 2026</span>
          <h1>把喜欢的生活，加入购物车。</h1>
          <p>精选数码、家居、运动与生活好物。支持商品筛选、购物车、本地下单、库存扣减和订单状态管理。</p>
          <div class="hero-actions">
            <button class="btn btn-light" id="shopNow">开始选购</button>
            <button class="btn btn-ghost-light" data-view-jump="orders">查看订单</button>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true"><div class="hero-orb">🛍️</div></div>
      </section>

      <div class="section-head" id="catalog">
        <div>
          <h2>热门商品</h2>
          <p>从日常需要，到生活灵感。</p>
        </div>
        <span id="resultCount" style="color:var(--muted);font-size:14px"></span>
      </div>

      <div class="toolbar">
        <label class="search-wrap">
          <span>⌕</span>
          <input class="field" id="searchInput" type="search" placeholder="搜索商品名称或描述" autocomplete="off" />
        </label>
        <select class="field" id="sortSelect" aria-label="商品排序">
          <option value="default">综合排序</option>
          <option value="priceAsc">价格从低到高</option>
          <option value="priceDesc">价格从高到低</option>
          <option value="rating">评分优先</option>
        </select>
      </div>
      <div class="chips" id="categoryChips"></div>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <section id="ordersView" class="hidden">
      <div class="section-head" style="margin-top:4px">
        <div>
          <h2>我的订单</h2>
          <p>查看订单明细并体验付款、收货与取消流程。</p>
        </div>
        <button class="btn btn-soft" data-view-jump="products">继续购物</button>
      </div>
      <div class="orders" id="ordersList"></div>
    </section>
  </main>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="购物车">
    <div class="drawer-head">
      <h3>购物车</h3>
      <button class="close-btn" id="closeCart" aria-label="关闭购物车">×</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="drawer-foot">
      <div class="summary-row"><span>商品金额</span><strong id="cartSubtotal">¥0.00</strong></div>
      <div class="summary-row"><span>配送费</span><strong id="shippingFee">¥0.00</strong></div>
      <div class="summary-row total"><span>合计</span><span id="cartTotal">¥0.00</span></div>
      <button class="btn btn-primary btn-full" id="checkoutButton">去结算</button>
    </div>
  </aside>

  <div class="modal-overlay" id="modalOverlay"></div>
  <section class="modal" id="checkoutModal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
    <div class="modal-head">
      <h3 id="checkoutTitle">填写订单</h3>
      <button class="close-btn" id="closeCheckout" aria-label="关闭结算窗口">×</button>
    </div>
    <form class="modal-body" id="checkoutForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="receiverName">收货人</label>
          <input class="field" id="receiverName" name="receiverName" maxlength="30" required placeholder="请输入姓名" />
        </div>
        <div class="form-group">
          <label for="receiverPhone">手机号码</label>
          <input class="field" id="receiverPhone" name="receiverPhone" inputmode="tel" required pattern="1[3-9][0-9]{9}" placeholder="11 位手机号码" />
        </div>
        <div class="form-group full">
          <label for="receiverAddress">收货地址</label>
          <textarea class="field" id="receiverAddress" name="receiverAddress" maxlength="160" required placeholder="省 / 市 / 区 / 街道及门牌号"></textarea>
        </div>
        <div class="form-group full">
          <label for="paymentMethod">支付方式</label>
          <select class="field" id="paymentMethod" name="paymentMethod">
            <option value="在线支付（演示）">在线支付（演示）</option>
            <option value="货到付款">货到付款</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="orderRemark">订单备注</label>
          <input class="field" id="orderRemark" name="orderRemark" maxlength="80" placeholder="选填，例如配送时间要求" />
        </div>
      </div>
      <div class="checkout-box">
        <div class="summary-row"><span>商品数量</span><strong id="checkoutItems">0 件</strong></div>
        <div class="summary-row"><span>配送费</span><strong id="checkoutShipping">¥0.00</strong></div>
        <div class="summary-row total"><span>应付金额</span><span id="checkoutTotal">¥0.00</span></div>
      </div>
      <button class="btn btn-primary btn-full" type="submit">提交订单</button>
      <p class="fine-print">本页面为功能演示，未接入真实支付网关。商品、购物车和订单数据仅保存在当前浏览器中。</p>
    </form>
  </section>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <footer>
    <div class="container">© 2026 星选商城 · 商品 / 购物车 / 订单一体化演示</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
